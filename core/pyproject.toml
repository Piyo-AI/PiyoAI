[project]
name = "piyo"
version = "0.1.1"
description = "Piyo AI core: agent, models, skills and local API for the desktop app"
readme = "README.md"
license = "MIT"
authors = [{ name = "Piyo AI" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "playwright>=1.48",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "tzdata>=2024.1",  # time zone names on Windows, which has no system database
    "send2trash>=2.1.0",
]

[project.scripts]
piyo-core = "piyo.server.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6,!=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piyo"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
