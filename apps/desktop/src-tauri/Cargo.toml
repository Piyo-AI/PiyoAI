[package]
name = "piyo-desktop"
version = "0.1.0"
description = "Piyo AI desktop app"
authors = ["Piyo AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "piyo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Fewer parallel codegen units and no debug info: lighter on CPU, RAM and disk while compiling.
debug = 0
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
