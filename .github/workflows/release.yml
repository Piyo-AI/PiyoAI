name: Release

# Pushing a tag like v0.1.0 builds the installers on each OS and attaches them to a DRAFT GitHub release.
# Nothing is published until a maintainer reviews the draft and presses Publish. Builds are unsigned for now
# (signing is Phase 5 A): Windows SmartScreen and macOS Gatekeeper will warn about them.
# Run it by hand (Actions > Release > Run workflow) to get the installers as workflow artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release text is written from the commit subjects since the previous tag (scripts/release_notes.py),
  # so write them for a reader. A manual run has no tag and no release, so it skips this.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and the tags: the notes compare with the previous release
      - id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_notes.py "${{ github.ref_name }}" > notes.md
          cat notes.md
          { echo "body<<NOTES_EOF"; cat notes.md; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.name }})
    needs: [notes]
    # `notes` is skipped on a manual run; the builds still go ahead.
    if: ${{ !cancelled() && (needs.notes.result == 'success' || needs.notes.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5" # the oldest macOS we support; ignored elsewhere
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, bundles: "nsis" }
          # `app` as well as `dmg`: the updater needs the .app.tar.gz (and its .sig) that only the app bundle produces,
          # without it latest.json has no macOS entry and Macs are never offered an update.
          - { name: macOS Apple Silicon, os: macos-latest, bundles: "app,dmg" }
          - { name: Linux x64, os: ubuntu-22.04, bundles: "appimage,deb,rpm" }
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev rpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: core/uv.lock

      # The scripts run on uv's Python 3.12, not the runner's own (Ubuntu 22.04 has 3.10, which has no tomllib).
      - name: The tag matches the version in the files
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run --no-project python scripts/check_version.py "${{ github.ref_name }}"

      # The packaged core (with uv and Deno), smoke-tested before it goes into an installer.
      - run: uv run --no-project python scripts/build_core.py --smoke
      - run: uv run --no-project python scripts/check_targets.py core/dist/piyo-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (not code signing). The matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --config src-tauri/tauri.bundle.json --bundles ${{ matrix.bundles }}
          # A tag push makes (or adds to) one draft release; a manual run only keeps the files as artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Piyo AI {0}', github.ref_name) || '' }}
          # latest.json (the update manifest) is uploaded with the release. The updater reads it from
          # releases/latest/download, which GitHub only serves for a PUBLISHED, non-pre-release release.
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          releaseBody: ${{ needs.notes.outputs.body }}

      # The desktop program itself (the check reads it, it does not run it).
      - name: The app needs no newer OS than we support
        shell: bash
        run: uv run --no-project python scripts/check_targets.py apps/desktop/src-tauri/target/release/piyo-desktop*

      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          # Only the installers: the folders beside them hold the unpacked build (1 GB on Linux).
          path: |
            apps/desktop/src-tauri/target/release/bundle/*/*.exe
            apps/desktop/src-tauri/target/release/bundle/*/*.dmg
            apps/desktop/src-tauri/target/release/bundle/*/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/*/*.deb
            apps/desktop/src-tauri/target/release/bundle/*/*.rpm
            apps/desktop/src-tauri/target/release/bundle/*/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: error
